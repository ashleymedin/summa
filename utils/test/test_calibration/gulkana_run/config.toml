# generated by test_calibration_gulkana.sh

[simulation]

case_name = "gulkana"

# one spinup year (2008) precedes the simulation, which the calibration then scores
start_time = "2009-01-01 00:00"
end_time   = "2012-12-31 23:00"
time_zone  = "utcTime"

use_mizuroute    = false
write_timeseries = false

work_path = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_run/output"


[summa_files]

settings_path = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana/summa_inputs/"
forcing_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana/forcing/"
state_path    = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_run/state/"
output_path   = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_run/output/"

init_condition = "coldState.nc"
attributes     = "attributes.nc"
forcing_list   = "forcingFileList.txt"

decisions        = "modelDecisions.txt"
output_control   = "outputControl.txt"
trial_params     = "trialParams.nc"
local_parameters = "localParamInfo.txt"
basin_parameters = "basinParamInfo.txt"

vegetation_table = "TBL_VEGPARM.TBL"
soil_table       = "TBL_SOILPARM.TBL"
general_table    = "TBL_GENPARM.TBL"
noahmp_table     = "TBL_MPTABLE.TBL"


[calibration]

algorithm = "nsga2"

start_date = "2009-01-01"
end_date   = "2012-12-31"

n_samples = 32

param_list = [
    "k_soil",
    "theta_sat",
    "aquiferBaseflowExp",
    "aquiferBaseflowRate",
    "qSurfScale",
    "summerLAI",
    "frozenPrecipMultip",
    "Fcapil",
    "tempCritRain",
    "heightCanopyTop",
    "heightCanopyBottom",
    "windReductionParam",
    "vGn_n",
    "routingGammaScale",
    "routingGammaShape",
    "glacierWindFactor",
    "glacierTempReduction",
    "glacStor_kIce",
    "glacStor_kSnow",
    "glacStor_kFirn",
    "debrisConc",
    "k_snow",
    "mw_exp",
    "albedoDecayRate",
    "albedoMax"
]

write_aligned = false


[calibration.parameter_transformations]

k_soil              = "log"
aquiferBaseflowRate = "log"


[[parameter_dependencies.ordered]]

parameters   = ["heightCanopyBottom", "heightCanopyTop"]
gap_fraction = 0.25

[[parameter_dependencies.ordered]]

parameters   = ["theta_res", "critSoilWilting", "critSoilTranspire", "fieldCapacity", "theta_sat"]
gap_fraction = 0.025
sample_gaps  = true


[calibration.nsga2]

population_size = 8


# discharge below the glacier: the GRU's routed runoff times its area
[[calibration.target]]

name      = "discharge"
variable  = "streamflow"
gru       = 1
obs_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana/observations/"
obs_file  = "USGS_15478040_daily_flow.nc"
vname_obs = "q_obs"
metric    = "kge"


# winter and summer balances between the simulation's own extremes
[[calibration.target]]

name       = "mass_balance"
variable   = "basin__GlacierMassChange"
gru        = 1
obs_path   = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana/observations/"
obs_file   = "gulkana_mass_balance_seasonal.nc"
vname_obs  = "mb_obs"
accumulate = true
balance    = "seasonal"
metric     = "rmse"


