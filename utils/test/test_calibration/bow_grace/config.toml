# generated by test_calibration_bow.sh -- a short calibration on the bundled Bow domain

[simulation]

case_name = "CAN_05BB001"

# one spinup year (1980) precedes the simulation, which the calibration then scores
start_time = "1981-01-01 00:00"
end_time   = "1981-12-31 23:00"
time_zone  = "utcTime"

# simulated streamflow for the objective comes from mizuRoute
use_mizuroute    = true
write_timeseries = false

work_path = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_calibration/bow_grace/output"


[summa_files]

settings_path = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_mizuroute/bow_real_data/summa_inputs/"
forcing_path  = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_mizuroute/bow_real_data/summa_inputs/"
state_path    = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_calibration/bow_grace/state/"
output_path   = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_calibration/bow_grace/output/"

init_condition = "coldState.nc"
attributes     = "attributes.nc"
forcing_list   = "forcingFileList.txt"

decisions        = "modelDecisions.txt"
output_control   = "outputControl_short.txt"
trial_params     = "trialParams.nc"
local_parameters = "localParamInfo.txt"
basin_parameters = "basinParamInfo.txt"

vegetation_table = "TBL_VEGPARM.TBL"
soil_table       = "TBL_SOILPARM.TBL"
general_table    = "TBL_GENPARM.TBL"
noahmp_table     = "TBL_MPTABLE.TBL"


[mizuRoute]

namelist_path = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_mizuroute/bow_real_data/mizuroute_inputs/"
namelist_file = "mizuroute.param"

methods = "3"
dt      = 3600

write_qbasin = false
write_Qreach = false


[hydrofabric]

hfabric_path = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_mizuroute/bow_real_data/mizuroute_inputs/"
hfabric_file = "topology.nc"

dname_seg = "seg"
dname_hru = "hru"

varname_HRUid     = "hruId"
varname_segId     = "segId"
varname_hruSegId  = "hruToSegId"
varname_downSegId = "downSegId"

varname_area   = "area"
varname_slope  = "slope"
varname_length = "length"

seg_outlet = 710285850


[remapping]

remap_path = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_mizuroute/bow_real_data/mizuroute_inputs/"
remap_file = "lumped_to_hru.nc"

dname_hru  = "polyid"
dname_data = "data"

vname_hruid    = "polyid"
vname_num_qhru = "nOverlaps"
vname_weight   = "weight"
vname_qhruid   = "qhru_id"


[observations]

obs_path = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_mizuroute/bow_real_data/mizuroute_inputs/"
obs_file = "CAN_05BB001_daily_flow_observations.nc"

vname_obsflow = "q_obs"


[calibration]

metric        = "kge"
obs_transform = "none"

start_date = "1981-01-01"
end_date   = "1981-12-31"

n_samples = 8

param_list = [
    "k_soil",
    "theta_sat",
    "aquiferScaleFactor",
    "routingGammaScale",
    "routingGammaShape"
]

write_aligned = false


[calibration.parameter_transformations]

k_soil = "log"


[[calibration.target]]
name      = "discharge"
variable  = "streamflow"
obs_file  = "CAN_05BB001_daily_flow_observations.nc"
vname_obs = "q_obs"
metric    = "kge"

[[calibration.target]]
name           = "grace_tws"
variable       = "basin__StorageChange"
obs_path       = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_calibration/"
obs_file       = "synthetic_grace.csv"
obs_format     = "csv"
vname_obs      = "grace_jpl_anomaly"
obs_units      = "mm"
accumulate     = true
cadence        = "monthly"
baseline_start = "1981-01-01"
baseline_end   = "1981-12-31"
metric         = "rmse"
weight         = 0.0

[[calibration.target]]
name           = "grace_tws_shifted"
variable       = "basin__StorageChange"
obs_path       = "/Users/amedin/Research/MODFLOW/modflow6/srcextern/summa/utils/test/test_calibration/"
obs_file       = "synthetic_grace.csv"
obs_format     = "csv"
vname_obs      = "grace_jpl_shifted"
obs_units      = "mm"
accumulate     = true
cadence        = "monthly"
baseline_start = "1981-01-01"
baseline_end   = "1981-12-31"
metric         = "rmse"
weight         = 0.0
